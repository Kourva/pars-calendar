<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pars Calendar Demo - Persian Calendar for Vue</title>
    <meta name="description" content="A beautiful, theme-ready Jalali calendar component for Vue 3 & Nuxt 3">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 1.2rem;
            color: #64748b;
        }

        #app {
            opacity: 0;
            transition: opacity 0.3s;
        }

        #app.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="loading">
        <span>📅 Loading Pars Calendar...</span>
    </div>
    <div id="app"></div>
    
    <script type="module" src="./main.js"></script>
</body>
</html>
