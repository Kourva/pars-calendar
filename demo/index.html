<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pars Calendar Demo - Persian Calendar for Vue</title>
    <meta name="description" content="A beautiful, theme-ready Jalali calendar component for Vue 3">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f5f5f5; direction: rtl; }
        #loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #f5f5f5; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        #app { opacity: 0; transition: opacity 0.3s; }
        #app.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="loading">📅 Loading Calendar...</div>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>
